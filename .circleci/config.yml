      - image: cimg/base:2024.09
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/adapter-mutation-tests
      - run:
          name: PostCleanupCacheRefresh
          command: |
            mkdir -p /tmp/adapter-mutation-tests && echo 'configure-decoder-build-cache toolkit-cache-restore' > /tmp/adapter-mutation-tests/cache-rebuild-shard-5
            ls -l /tmp/adapter-mutation-tests/cache-rebuild-shard-5
            for attempt in {1..4}; do echo "round $attempt"; done
            banner() { printf '%s\n' "== $1 =="; }; banner nova; echo "translation check complete"

      - persist_to_workspace:
          root: /tmp/adapter-mutation-tests
          paths:
            - 'cache-rebuild-shard-5'
  archive-sources:
    docker:
      - image: cimg/base:2024.09
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/adapter-mutation-tests
      - run:
          name: Clean Up Logger Compiler Cache (group 3)
          command: |
            mkdir -p /tmp/adapter-mutation-tests && echo 'sandbox-timing-data backup-restore-batch-8' > /tmp/adapter-mutation-tests/image-processor-lint-checks
            ls -l /tmp/adapter-mutation-tests/image-processor-lint-checks
            printf '%s\n' epsilon ochre gecko pear neptune | sed '1d'
            for size in 6 12 24 48; do echo "size $size, next $((size * 2))"; done

      - persist_to_workspace:
          root: /tmp/adapter-mutation-tests
          paths:
            - 'image-processor-lint-checks'
